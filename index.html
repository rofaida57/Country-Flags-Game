<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أعلام العالم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --onyx:#0A1120;
    --onyx-2:#050810;
    --leather:#1B233A;
    --leather-2:#141B30;
    --gold:#D4AF37;
    --gold-light:#F3DE8A;
    --gold-deep:#8B6B1F;
    --ivory:#FBF6EA;
    --emerald:#1F6E5C;
    --emerald-light:#3E9C86;
    --ruby:#9E2B25;
    --ruby-light:#C4453D;
    --parchment:#F3E9D2;
    --parchment-2:#E9DBB6;
    --ink:#241E17;
    --muted:#7C7362;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(212,175,55,.08) 0%, transparent 60%),
      radial-gradient(1000px 700px at 105% 105%, rgba(212,175,55,.06) 0%, transparent 55%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.014) 0px, rgba(255,255,255,.014) 1px, transparent 1px, transparent 7px),
      linear-gradient(180deg, var(--onyx) 0%, var(--onyx-2) 100%);
    color:var(--ivory);
    font-family:'Tajawal', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px 14px;
    overflow-x:hidden;
  }
  .stage{ width:100%; max-width:460px; }

  /* ===== Header / crest ===== */
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:16px;
  }
  .seal{
    width:44px;height:44px;
    flex:0 0 auto;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));
    animation:idle-spin 14s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .seal{ animation:none; } }
  @keyframes idle-spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

  .brand h1{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    background:linear-gradient(180deg, var(--gold-light), var(--gold) 55%, var(--gold-deep));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,.4));
  }
  .brand small{
    display:block;
    font-size:11px;
    color:#93A0BE;
    font-weight:500;
    letter-spacing:.3px;
    margin-top:2px;
  }

  /* ===== Card shell (leather passport) ===== */
  .card{
    position:relative;
    background:
      radial-gradient(120% 140% at 50% -10%, rgba(255,255,255,.05), transparent 55%),
      var(--parchment);
    border-radius:24px;
    padding:24px 20px 26px;
    box-shadow:
      0 30px 60px rgba(0,0,0,.55),
      0 0 0 1px rgba(212,175,55,.35),
      0 0 0 5px rgba(212,175,55,.08);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:9px;
    border:1.5px solid rgba(212,175,55,.55);
    border-radius:16px;
    pointer-events:none;
  }
  .card::after{
    content:"";
    position:absolute; inset:13px;
    border:1px dashed rgba(36,30,23,.18);
    border-radius:13px;
    pointer-events:none;
  }
  .corner{
    position:absolute;
    width:20px;height:20px;
    border:2px solid var(--gold);
    opacity:.55;
    z-index:2;
  }
  .corner.tl{ top:6px; left:6px; border-left:none; border-top:none; border-radius:0 0 8px 0; }
  .corner.tr{ top:6px; right:6px; border-right:none; border-top:none; border-radius:0 0 0 8px; }
  .corner.bl{ bottom:6px; left:6px; border-left:none; border-bottom:none; border-radius:0 8px 0 0; }
  .corner.br{ bottom:6px; right:6px; border-right:none; border-bottom:none; border-radius:8px 0 0 0; }

  /* progress dots */
  .progress{ display:flex; gap:6px; justify-content:center; margin-bottom:20px; position:relative; z-index:1; }
  .dot{ width:9px;height:9px;border-radius:50%; background:rgba(36,30,23,.16); transition:transform .25s ease, background .25s ease, box-shadow .25s ease; }
  .dot.done{ background:var(--emerald); }
  .dot.current{ background:var(--gold); transform:scale(1.4); box-shadow:0 0 0 4px rgba(212,175,55,.22); }

  .screen{ position:relative; z-index:1; text-align:center; }

  /* ===== Start screen ===== */
  #startScreen .hero-icon{ width:64px; height:64px; margin:0 auto 8px; display:block; filter:drop-shadow(0 4px 8px rgba(0,0,0,.2)); }
  #startScreen h2{
    font-family:'Cairo',sans-serif; font-weight:900; font-size:23px;
    color:var(--ink); margin:6px 0 8px;
  }
  #startScreen p{ color:#5b5344; font-size:14.5px; line-height:1.9; margin:0 auto 18px; max-width:320px; }

  .stat-row{ display:flex; justify-content:center; gap:14px; margin-bottom:20px; }
  .stat{
    position:relative;
    background:linear-gradient(180deg, var(--parchment-2), #E3D3A6);
    border:1px solid rgba(212,175,55,.5);
    border-radius:14px;
    padding:12px 18px;
    min-width:100px;
    box-shadow:0 6px 14px rgba(139,107,31,.15) inset, 0 4px 10px rgba(0,0,0,.06);
  }
  .stat .num{ font-family:'Cairo',sans-serif; font-weight:800; font-size:21px; color:var(--gold-deep); }
  .stat .lbl{ font-size:11px; color:var(--muted); margin-top:2px; }

  /* ===== Buttons (gold foil) ===== */
  .btn{
    position:relative;
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:15.5px;
    border:none;
    cursor:pointer;
    border-radius:14px;
    padding:16px 20px;
    width:100%;
    color:#2A2005;
    background:linear-gradient(180deg, var(--gold-light), var(--gold) 55%, var(--gold-deep));
    box-shadow:0 12px 26px rgba(139,107,31,.4), 0 1px 0 rgba(255,255,255,.5) inset;
    transition:transform .12s ease, box-shadow .12s ease;
    overflow:hidden;
  }
  .btn::after{
    content:"";
    position:absolute; top:0; bottom:0; left:-60%;
    width:40%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.55), transparent);
    transform:skewX(-20deg);
    animation:shine 3.2s ease-in-out infinite;
  }
  @keyframes shine{ 0%{ left:-60%; } 45%{ left:130%; } 100%{ left:130%; } }
  .btn:active{ transform:scale(.97); box-shadow:0 4px 12px rgba(139,107,31,.35); }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:2px solid rgba(212,175,55,.6);
    box-shadow:none;
    margin-top:10px;
  }
  .btn.secondary::after{ display:none; }

  /* ===== Quiz screen ===== */
  #quizScreen{ display:none; }
  .flag-wrap{
    display:flex; flex-direction:column; align-items:center;
    margin-bottom:18px; position:relative;
  }
  .medallion{
    position:relative;
    width:150px; height:150px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 40%, #FFFDF6 0%, var(--ivory) 55%, #F1E9D4 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:
      0 0 0 3px var(--gold),
      0 0 0 7px rgba(212,175,55,.18),
      0 16px 26px rgba(0,0,0,.28) ;
  }
  .medallion::before{
    content:"";
    position:absolute; inset:10px;
    border-radius:50%;
    border:1.5px dashed rgba(139,107,31,.5);
  }
  .flag-emoji{ font-size:72px; line-height:1; filter:drop-shadow(0 6px 8px rgba(0,0,0,.2)); }
  .ribbon{
    width:0; height:0;
    margin-top:-6px;
    border-left:15px solid var(--ruby);
    border-right:15px solid var(--ruby);
    border-bottom:20px solid transparent;
    position:relative;
  }
  .ribbon::before, .ribbon::after{
    content:""; position:absolute; top:0; width:15px; height:26px; background:var(--ruby-light);
  }
  .ribbon::before{ left:-15px; clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%); }
  .ribbon::after{ right:-15px; clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%); }

  .question-txt{
    font-family:'Cairo',sans-serif; font-weight:800; font-size:16px;
    color:var(--ink); margin:0 0 16px;
  }
  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .opt{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:13.5px;
    background:var(--ivory);
    border:2px solid rgba(212,175,55,.35);
    border-radius:14px;
    padding:14px 8px;
    color:var(--ink);
    cursor:pointer;
    transition:transform .1s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .opt:active{ transform:scale(.96); }
  .opt.correct{ background:#E4F3EE; border-color:var(--emerald); color:var(--emerald); box-shadow:0 0 0 3px rgba(31,110,92,.15); }
  .opt.wrong{ background:#F8E8E6; border-color:var(--ruby); color:var(--ruby); box-shadow:0 0 0 3px rgba(158,43,37,.12); }
  .opt[disabled]{ cursor:default; }

  .footer-row{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Cairo',sans-serif; font-weight:700; font-size:13px;
    color:var(--muted); padding:0 2px;
  }
  .footer-row .score{ color:var(--ink); }
  .footer-row .streak{ color:var(--gold-deep); }
  .flame{ display:inline-block; }

  /* ===== Stamp overlay ===== */
  .stamp{
    position:absolute; top:44%; left:50%;
    width:150px; height:150px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    opacity:0;
    z-index:5;
  }
  .stamp .ring{
    width:100%; height:100%; border-radius:50%;
    border:4px solid currentColor;
    outline:2px solid currentColor;
    outline-offset:6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.05);
  }
  .stamp .ring::before{
    content:"★ ★ ★";
    font-size:9px;
    letter-spacing:2px;
    opacity:.8;
    margin-bottom:2px;
  }
  .stamp span{ font-family:'Cairo',sans-serif; font-weight:900; font-size:20px; }
  .stamp.show{ animation: slam .55s cubic-bezier(.2,1.4,.4,1) forwards; }
  .stamp.good{ color:var(--emerald); transform:translate(-50%,-50%) rotate(-12deg); }
  .stamp.bad{ color:var(--ruby); transform:translate(-50%,-50%) rotate(9deg); }
  @keyframes slam{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(2.6) rotate(var(--rot,-12deg)); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(var(--rot,-12deg)); }
  }

  /* ===== End screen ===== */
  #endScreen{ display:none; }
  #endScreen .trophy{ width:74px; height:74px; margin:0 auto 6px; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,.25)); }
  #endScreen h2{ font-family:'Cairo',sans-serif; font-weight:900; font-size:22px; color:var(--ink); margin:6px 0 4px; }
  #endScreen .score-line{
    font-family:'Cairo',sans-serif; font-weight:900; font-size:38px;
    background:linear-gradient(180deg, var(--gold-light), var(--gold) 60%, var(--gold-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:6px 0 2px;
  }
  #endScreen .best-line{ font-size:13.5px; color:var(--muted); margin-bottom:20px; }
  #endScreen .best-line b{ color:var(--gold-deep); }

  .hint{ text-align:center; color:#6E7DA0; font-size:11.5px; margin-top:14px; }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <svg class="seal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F3DE8A"/>
          <stop offset="55%" stop-color="#D4AF37"/>
          <stop offset="100%" stop-color="#8B6B1F"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
      <circle cx="50" cy="50" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" stroke-dasharray="2 4"/>
      <g fill="url(#goldGrad)">
        <path d="M50 14 L54 46 L50 50 L46 46 Z"/>
        <path d="M50 86 L54 54 L50 50 L46 54 Z"/>
        <path d="M14 50 L46 46 L50 50 L46 54 Z"/>
        <path d="M86 50 L54 54 L50 50 L54 46 Z"/>
      </g>
      <circle cx="50" cy="50" r="6" fill="url(#goldGrad)"/>
    </svg>
    <div>
      <h1>أعلام العالم</h1>
      <small>اختبر ذاكرتك، دولة بعد دولة</small>
    </div>
  </div>

  <div class="card">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <!-- START -->
    <div class="screen" id="startScreen">
      <svg class="hero-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8B6B1F"/><stop offset="100%" stop-color="#D4AF37"/>
          </linearGradient>
        </defs>
        <rect x="16" y="10" width="68" height="80" rx="8" fill="#1B233A" stroke="url(#hg)" stroke-width="3"/>
        <circle cx="50" cy="40" r="14" fill="none" stroke="url(#hg)" stroke-width="3"/>
        <path d="M50 26 L50 54 M36 40 L64 40" stroke="url(#hg)" stroke-width="2.5"/>
        <path d="M30 68 h40 M30 76 h26" stroke="url(#hg)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <h2>مستعد لرحلة الأعلام؟</h2>
      <p>عشرة أعلام عشوائية من نحو 195 دولة حول العالم. اختر اسم الدولة الصحيح وحافظ على سلسلة إجاباتك الذهبية.</p>
      <div class="stat-row">
        <div class="stat">
          <div class="num" id="bestScoreDisplay">–</div>
          <div class="lbl">أفضل نتيجة</div>
        </div>
        <div class="stat">
          <div class="num" id="playsDisplay">–</div>
          <div class="lbl">عدد الجولات</div>
        </div>
      </div>
      <button class="btn" id="startBtn">ابدأ الرحلة</button>
      <div class="hint">النتيجة تُحفظ تلقائياً على هذا الهاتف</div>
    </div>

    <!-- QUIZ -->
    <div class="screen" id="quizScreen">
      <div class="progress" id="progressDots"></div>

      <div class="flag-wrap">
        <div class="medallion">
          <div class="flag-emoji" id="flagEmoji">🏳️</div>
          <div class="stamp" id="stampOverlay">
            <div class="ring"><span id="stampText"></span></div>
          </div>
        </div>
        <div class="ribbon"></div>
      </div>

      <p class="question-txt">ما اسم هذه الدولة؟</p>

      <div class="options" id="optionsWrap"></div>

      <div class="footer-row">
        <span class="score">النقاط: <span id="scoreLive">0</span></span>
        <span class="streak"><span class="flame">🔥</span> <span id="streakLive">0</span></span>
      </div>
    </div>

    <!-- END -->
    <div class="screen" id="endScreen">
      <svg class="trophy" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F3DE8A"/><stop offset="60%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#8B6B1F"/>
          </linearGradient>
        </defs>
        <path d="M30 20 h40 v14 c0 14 -9 22 -20 22 s-20 -8 -20 -22 Z" fill="url(#tg)"/>
        <path d="M30 24 c-10 0 -16 6 -16 14 c0 8 6 12 13 12" fill="none" stroke="url(#tg)" stroke-width="4"/>
        <path d="M70 24 c10 0 16 6 16 14 c0 8 -6 12 -13 12" fill="none" stroke="url(#tg)" stroke-width="4"/>
        <rect x="45" y="54" width="10" height="14" fill="url(#tg)"/>
        <rect x="34" y="68" width="32" height="8" rx="2" fill="url(#tg)"/>
        <rect x="28" y="76" width="44" height="8" rx="2" fill="url(#tg)"/>
        <path d="M50 26 l3.5 7 7.5 1 -5.5 5.3 1.3 7.5 -6.8 -3.6 -6.8 3.6 1.3 -7.5 -5.5 -5.3 7.5 -1 Z" fill="#fff" opacity=".9"/>
      </svg>
      <h2 id="endTitle">أحسنت!</h2>
      <div class="score-line"><span id="finalScore">0</span> / 10</div>
      <div class="best-line" id="bestLine"></div>
      <button class="btn" id="againBtn">جولة جديدة</button>
      <button class="btn secondary" id="homeBtn">العودة للبداية</button>
    </div>

  </div>
</div>

    ["🇦🇱","ألبانيا"],["🇦🇩","أندورا"],["🇦🇹","النمسا"],["🇧🇾","بيلاروسيا"],["🇧🇪","بلجيكا"],
    ["🇧🇦","البوسنة والهرسك"],["🇧🇬","بلغاريا"],["🇭🇷","كرواتيا"],["🇨🇿","التشيك"],["🇩🇰","الدنمارك"],
    ["🇪🇪","إستونيا"],["🇫🇮","فنلندا"],["🇫🇷","فرنسا"],["🇩🇪","ألمانيا"],["🇬🇷","اليونان"],
    ["🇭🇺","المجر"],["🇮🇸","آيسلندا"],["🇮🇪","أيرلندا"],["🇮🇹","إيطاليا"],["🇽🇰","كوسوفو"],
    ["🇱🇻","لاتفيا"],["🇱🇮","ليختنشتاين"],["🇱🇹","ليتوانيا"],["🇱🇺","لوكسمبورغ"],["🇲🇹","مالطا"],
    ["🇲🇩","مولدوفا"],["🇲🇨","موناكو"],["🇲🇪","الجبل الأسود"],["🇳🇱","هولندا"],["🇲🇰","مقدونيا الشمالية"],
    ["🇳🇴","النرويج"],["🇵🇱","بولندا"],["🇵🇹","البرتغال"],["🇷🇴","رومانيا"],["🇷🇺","روسيا"],
    ["🇸🇲","سان مارينو"],["🇷🇸","صربيا"],["🇸🇰","سلوفاكيا"],["🇸🇮","سلوفينيا"],["🇪🇸","إسبانيا"],
    ["🇸🇪","السويد"],["🇨🇭","سويسرا"],["🇺🇦","أوكرانيا"],["🇬🇧","بريطانيا"],["🇻🇦","الفاتيكان"],
    ["🇦🇬","أنتيغوا وبربودا"],["🇧🇸","جزر البهاما"],["🇧🇧","باربادوس"],["🇧🇿","بليز"],["🇨🇦","كندا"],
    ["🇨🇷","كوستاريكا"],["🇨🇺","كوبا"],["🇩🇲","دومينيكا"],["🇩🇴","جمهورية الدومينيكان"],["🇸🇻","السلفادور"],
    ["🇬🇩","غرينادا"],["🇬🇹","غواتيمالا"],["🇭🇹","هايتي"],["🇭🇳","هندوراس"],["🇯🇲","جامايكا"],
    ["🇲🇽","المكسيك"],["🇳🇮","نيكاراغوا"],["🇵🇦","بنما"],["🇰🇳","سانت كيتس ونيفيس"],["🇱🇨","سانت لوسيا"],
    ["🇻🇨","سانت فينسنت والغرينادين"],["🇹🇹","ترينيداد وتوباغو"],["🇺🇸","الولايات المتحدة"],
    ["🇦🇷","الأرجنتين"],["🇧🇴","بوليفيا"],["🇧🇷","البرازيل"],["🇨🇱","تشيلي"],["🇨🇴","كولومبيا"],
    ["🇪🇨","الإكوادور"],["🇬🇾","غيانا"],["🇵🇾","باراغواي"],["🇵🇪","بيرو"],["🇸🇷","سورينام"],
    ["🇺🇾","أوروغواي"],["🇻🇪","فنزويلا"],
    ["🇦🇺","أستراليا"],["🇫🇯","فيجي"],["🇰🇮","كيريباتي"],["🇲🇭","جزر مارشال"],["🇫🇲","ميكرونيزيا"],
    ["🇳🇷","ناورو"],["🇳🇿","نيوزيلندا"],["🇵🇼","بالاو"],["🇵🇬","بابوا غينيا الجديدة"],["🇼🇸","ساموا"],
    ["🇸🇧","جزر سليمان"],["🇹🇴","تونغا"],["🇹🇻","توفالو"],["🇻🇺","فانواتو"]
  ];
  const ROUND_LEN = 10;

  const startScreen = document.getElementById('startScreen');
  const quizScreen = document.getElementById('quizScreen');
  const endScreen = document.getElementById('endScreen');
  const progressDots = document.getElementById('progressDots');
  const flagEmoji = document.getElementById('flagEmoji');
  const optionsWrap = document.getElementById('optionsWrap');
  const scoreLive = document.getElementById('scoreLive');
  const streakLive = document.getElementById('streakLive');
  const stampOverlay = document.getElementById('stampOverlay');
  const stampText = document.getElementById('stampText');
  const bestScoreDisplay = document.getElementById('bestScoreDisplay');
  const playsDisplay = document.getElementById('playsDisplay');
  const finalScore = document.getElementById('finalScore');
  const bestLine = document.getElementById('bestLine');
  const endTitle = document.getElementById('endTitle');

  let round = [];
  let qIndex = 0;
  let score = 0;
  let streak = 0;
  let locked = false;
  let stats = { best: 0, plays: 0 };

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  async function loadStats(){
    try{
      const res = await window.storage.get('flag-game-stats');
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        stats.best = parsed.best || 0;
        stats.plays = parsed.plays || 0;
      }
    }catch(e){ /* no saved stats yet */ }
    renderStartStats();
  }

  async function saveStats(){
    try{ await window.storage.set('flag-game-stats', JSON.stringify(stats)); }
    catch(e){ /* storage unavailable, continue with in-memory only */ }
  }

  function renderStartStats(){
    bestScoreDisplay.textContent = stats.plays > 0 ? (stats.best + '/10') : '–';
    playsDisplay.textContent = stats.plays;
  }

  function buildProgressDots(){
    progressDots.innerHTML = '';
    for(let i=0;i<ROUND_LEN;i++){
      const d = document.createElement('div');
      d.className = 'dot';
      progressDots.appendChild(d);
    }
  }
  function updateProgressDots(){
    const dots = progressDots.children;
    for(let i=0;i<dots.length;i++){
      dots[i].classList.remove('current','done');
      if(i < qIndex) dots[i].classList.add('done');
      else if(i === qIndex) dots[i].classList.add('current');
    }
  }

  function startRound(){
    round = shuffle(COUNTRIES).slice(0, ROUND_LEN);
    qIndex = 0; score = 0; streak = 0;
    scoreLive.textContent = '0';
    streakLive.textContent = '0';
    buildProgressDots();
    startScreen.style.display = 'none';
    endScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    showQuestion();
  }

  function showQuestion(){
    locked = false;
    updateProgressDots();
    const correct = round[qIndex];
    flagEmoji.textContent = correct[0];

    const distractorsPool = shuffle(COUNTRIES.filter(c => c[1] !== correct[1]));
    const options = shuffle([correct, ...distractorsPool.slice(0,3)]);

    optionsWrap.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt[1];
      btn.addEventListener('click', () => handleAnswer(btn, opt[1] === correct[1]));
      optionsWrap.appendChild(btn);
    });

    stampOverlay.classList.remove('show','good','bad');
    stampOverlay.style.opacity = 0;
  }

  function handleAnswer(btn, isCorrect){
    if(locked) return;
    locked = true;

    const allOpts = optionsWrap.querySelectorAll('.opt');
    allOpts.forEach(o => o.setAttribute('disabled','true'));

    if(isCorrect){
      btn.classList.add('correct');
      score++; streak++;
      stampText.textContent = 'صحيح ✓';
      stampOverlay.classList.add('good');
      stampOverlay.style.setProperty('--rot','-12deg');
    } else {
      btn.classList.add('wrong');
      streak = 0;
      stampText.textContent = 'خطأ ✗';
      stampOverlay.classList.add('bad');
      stampOverlay.style.setProperty('--rot','9deg');
      allOpts.forEach(o => {
        if(o.textContent === round[qIndex][1]) o.classList.add('correct');
      });
    }
    stampOverlay.style.opacity = 1;
    stampOverlay.classList.add('show');

    scoreLive.textContent = score;
    streakLive.textContent = streak;

    setTimeout(() => {
      qIndex++;
      if(qIndex >= ROUND_LEN){ finishRound(); }
      else { showQuestion(); }
    }, 900);
  }

  async function finishRound(){
    updateProgressDots();
    stats.plays += 1;
    const isNewBest = score > stats.best;
    if(isNewBest) stats.best = score;
    await saveStats();

    quizScreen.style.display = 'none';
    endScreen.style.display = 'block';
    finalScore.textContent = score;

    if(score >= 9){ endTitle.textContent = 'إتقان رائع!'; }
    else if(score >= 6){ endTitle.textContent = 'أداء جيد جداً'; }
    else if(score >= 3){ endTitle.textContent = 'استمر بالتدريب'; }
    else { endTitle.textContent = 'جولة أولى، لا بأس'; }

    bestLine.innerHTML = isNewBest
      ? '<b>رقم قياسي جديد!</b> تم تحديث أفضل نتيجة'
      : 'أفضل نتيجة محفوظة: <b>' + stats.best + '/10</b>';

    renderStartStats();
  }

  document.getElementById('startBtn').addEventListener('click', startRound);
  document.getElementById('againBtn').addEventListener('click', startRound);
  document.getElementById('homeBtn').addEventListener('click', () => {
    endScreen.style.display = 'none';
    startScreen.style.display = 'block';
  });

  loadStats();
})();
</script>
